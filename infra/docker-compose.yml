services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safecross-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safecross}
      POSTGRES_USER: ${POSTGRES_USER:-safecross}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safecross_local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safecross} -d ${POSTGRES_DB:-safecross}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgis_data:
    name: safecross_postgis_data
