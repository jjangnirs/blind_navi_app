name: Security & Safety Phrase Scan

on:
  push:
  pull_request:

jobs:
  secret-and-safety-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: false

      - name: Scan for Forbidden Safety Phrases
        run: |
          echo "Scanning application code and resources for prohibited safety claims..."
          FORBIDDEN_WORDS=("안전합니다" "지금 건너세요" "차가 없습니다" "100% 녹색")
          SCAN_DIRS=("backend/app" "data-pipeline/safecross_pipeline" "android-app/app/src")
          
          VIOLATION_FOUND=0
          for dir in "${SCAN_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              for word in "${FORBIDDEN_WORDS[@]}"; do
                if grep -rn "$word" "$dir"; then
                  echo "::error file=$dir::Prohibited safety phrase '$word' detected in $dir"
                  VIOLATION_FOUND=1
                fi
              done
            fi
          done
          
          if [ $VIOLATION_FOUND -ne 0 ]; then
            echo "Security check failed: Prohibited safety phrases found in production code/resources."
            exit 1
          fi
          echo "No prohibited safety phrases found."
